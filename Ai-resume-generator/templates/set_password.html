<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Set Password | AI Resume Generator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <main class="login-container">
    <div class="login-card">
      <h2 class="text-center mb-4 fw-semibold text-gradient">Set Your Password</h2>
      {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
      {% for category, message in messages %}
      <div class="alert alert-{{ category }} alert-dismissible fade show app-alert" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      {% endfor %}
      {% endif %}
      {% endwith %}

      <form method="post" action="{{ url_for('set_password') }}">
        <div class="mb-3">
          <label for="new_password" class="form-label">New Password</label>
          <input type="password" id="new_password" name="new_password" class="form-control" minlength="6" required />
        </div>
        <div class="mb-3">
          <label for="confirm_password" class="form-label">Confirm Password</label>
          <input type="password" id="confirm_password" name="confirm_password" class="form-control" minlength="6" required />
        </div>
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="show_passwords">
          <label class="form-check-label" for="show_passwords">Show password</label>
        </div>
        <button type="submit" class="btn btn-gradient w-100 py-2 fw-semibold">Save Password</button>
      </form>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  <script>
    document.getElementById('show_passwords').addEventListener('change', function () {
      const type = this.checked ? 'text' : 'password';
      document.getElementById('new_password').type = type;
      document.getElementById('confirm_password').type = type;
    });
  </script>
</body>
</html>
