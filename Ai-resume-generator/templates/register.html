<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Resume Generator - Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <main class="login-container">
    <div class="login-card">
      <h2 class="text-center mb-4 fw-semibold text-gradient">Sign Up</h2>
      {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
      {% for category, message in messages %}
      <div class="alert alert-{{ category }} alert-dismissible fade show app-alert" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      {% endfor %}
      {% endif %}
      {% endwith %}
      <form method="post" action="{{ url_for('register') }}">
        <div class="mb-3">
          <label for="email" class="form-label">E-mail</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email" value="{{ prefill_email or '' }}" required />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <div class="input-group">
            <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required />
            <button class="btn btn-outline-secondary" type="button" data-password-toggle data-target="#password" aria-label="Toggle password visibility">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" stroke="currentColor" stroke-width="2" />
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" />
              </svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-gradient w-100 py-2 fw-semibold mt-3">Sign Up</button>
      </form>
      <!-- <a href="/google-login" class="btn btn-danger w-100 my-2">
        <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google logo" style="width:20px;margin-right:8px;vertical-align:middle;">
        Sign up with Google
      </a> -->
      <a href="/google-login" class="btn btn-gradient w-100 py-2 fw-semibold mt-3">
        <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google logo" style="width:20px;margin-right:8px;vertical-align:middle;">
        Sign up with Google
      </a>

      <p class="signup-text text-center mt-3">
        Already have an account?
        <a href="{{ url_for('login') }}" class="fw-bold text-gradient text-decoration-none">Login</a>
      </p>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
